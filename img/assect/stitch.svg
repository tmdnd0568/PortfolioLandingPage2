<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Google Stitch Official Icon Design with 4-Color Threads -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Arc (Blue) -->
    <path d="M16.5 4.5A5.5 5.5 0 0 0 7 7c0 3.2 4 4.8 6.5 6.2" stroke="#4285F4"/>
    <!-- Bottom Arc (Red) -->
    <path d="M7.5 19.5A5.5 5.5 0 0 0 17 17c0-3.2-4-4.8-6.5-6.2" stroke="#EA4335"/>
    <!-- Cross Stitch Accent 1 (Yellow) -->
    <path d="M15 9.5l2.5-2.5" stroke="#FBBC05" stroke-width="2"/>
    <!-- Cross Stitch Accent 2 (Green) -->
    <path d="M6.5 17l2.5-2.5" stroke="#34A853" stroke-width="2"/>
  </g>
  <!-- Needle Eye Dot -->
  <circle cx="12" cy="12" r="1.8" fill="#4285F4"/>
</svg>
